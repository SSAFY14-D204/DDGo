[versions]
# ─── Core ───────────────────────────────────────────────────────────────────
agp                     = "8.7.3"
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.28"
coreKtx                 = "1.13.1"
lifecycleRuntimeKtx     = "2.8.7"
activityCompose         = "1.9.3"
composeBom              = "2024.09.00"

# ─── DI ─────────────────────────────────────────────────────────────────────
hilt                    = "2.51.1"
hiltNavigationCompose   = "1.2.0"
navigationCompose       = "2.8.5"

# ─── Network ────────────────────────────────────────────────────────────────
retrofit                = "2.11.0"
retrofitSerializationConverter = "1.0.0"
okhttp                  = "4.12.0"
kotlinxSerialization    = "1.6.3"

# ─── Local Storage ──────────────────────────────────────────────────────────
datastore               = "1.1.1"
securityCrypto          = "1.1.0-alpha06"

# ─── AI / ML ────────────────────────────────────────────────────────────────
mediapipe               = "0.10.14"
tensorflowLite          = "2.16.1"

# ─── Background Work ────────────────────────────────────────────────────────
workRuntime             = "2.9.1"
hiltWork                = "1.2.0"

# ─── Media ──────────────────────────────────────────────────────────────────
media3                  = "1.4.1"
coil                    = "2.6.0"
cameraX                 = "1.4.1"

# ─── Desugaring ─────────────────────────────────────────────────────────────
desugarJdkLibs          = "2.0.4"

# ─── Testing ────────────────────────────────────────────────────────────────
junit                   = "4.13.2"
junitVersion            = "1.2.1"
espressoCore            = "3.6.1"
mockk                   = "1.13.12"
ui = "1.10.4"
uiText = "1.10.4"
foundation = "1.10.4"

[libraries]
# Core
androidx-core-ktx                   = { group = "androidx.core",                name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",           name = "lifecycle-runtime-ktx",         version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose           = { group = "androidx.activity",            name = "activity-compose",              version.ref = "activityCompose" }

# Compose BOM
androidx-compose-bom                = { group = "androidx.compose",             name = "compose-bom",                   version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",          name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",          name = "ui-graphics" }
androidx-ui-tooling                 = { group = "androidx.compose.ui",          name = "ui-tooling" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",          name = "ui-tooling-preview" }
androidx-ui-test-manifest           = { group = "androidx.compose.ui",          name = "ui-test-manifest" }
androidx-ui-test-junit4             = { group = "androidx.compose.ui",          name = "ui-test-junit4" }
androidx-material3                  = { group = "androidx.compose.material3",   name = "material3" }

# DI & Navigation
hilt-android                        = { group = "com.google.dagger",            name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",            name = "hilt-compiler",                 version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",                name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }
androidx-navigation-compose         = { group = "androidx.navigation",          name = "navigation-compose",            version.ref = "navigationCompose" }

# Network
retrofit                            = { group = "com.squareup.retrofit2",       name = "retrofit",                      version.ref = "retrofit" }
retrofit-serialization-converter    = { group = "com.jakewharton.retrofit",     name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerializationConverter" }
okhttp                              = { group = "com.squareup.okhttp3",         name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging-interceptor          = { group = "com.squareup.okhttp3",         name = "logging-interceptor",           version.ref = "okhttp" }
kotlinx-serialization-json          = { group = "org.jetbrains.kotlinx",        name = "kotlinx-serialization-json",    version.ref = "kotlinxSerialization" }

# Local Storage
androidx-datastore-preferences      = { group = "androidx.datastore",           name = "datastore-preferences",         version.ref = "datastore" }
security-crypto-ktx                 = { group = "androidx.security",            name = "security-crypto-ktx",           version.ref = "securityCrypto" }

# AI / ML
mediapipe-tasks-vision              = { group = "com.google.mediapipe",         name = "tasks-vision",                  version.ref = "mediapipe" }
tensorflow-lite                     = { group = "org.tensorflow",               name = "tensorflow-lite",               version.ref = "tensorflowLite" }
tensorflow-lite-gpu                 = { group = "org.tensorflow",               name = "tensorflow-lite-gpu",           version.ref = "tensorflowLite" }

# Background Work
work-runtime-ktx                    = { group = "androidx.work",                name = "work-runtime-ktx",              version.ref = "workRuntime" }
hilt-work                           = { group = "androidx.hilt",                name = "hilt-work",                     version.ref = "hiltWork" }
hilt-work-compiler                  = { group = "androidx.hilt",                name = "hilt-compiler",                 version.ref = "hiltWork" }

# Media
media3-exoplayer                    = { group = "androidx.media3",              name = "media3-exoplayer",              version.ref = "media3" }
media3-ui                           = { group = "androidx.media3",              name = "media3-ui",                     version.ref = "media3" }
coil-compose                        = { group = "io.coil-kt",                   name = "coil-compose",                  version.ref = "coil" }
coil-video                          = { group = "io.coil-kt",                   name = "coil-video",                    version.ref = "coil" }
androidx-camera-core                = { group = "androidx.camera",              name = "camera-core",                   version.ref = "cameraX" }
androidx-camera-camera2             = { group = "androidx.camera",              name = "camera-camera2",                version.ref = "cameraX" }
androidx-camera-lifecycle           = { group = "androidx.camera",              name = "camera-lifecycle",              version.ref = "cameraX" }
androidx-camera-video               = { group = "androidx.camera",              name = "camera-video",                  version.ref = "cameraX" }
androidx-camera-view                = { group = "androidx.camera",              name = "camera-view",                   version.ref = "cameraX" }

# Desugaring
desugar-jdk-libs                    = { group = "com.android.tools",            name = "desugar_jdk_libs",              version.ref = "desugarJdkLibs" }

# Testing
junit                               = { group = "junit",                        name = "junit",                         version.ref = "junit" }
androidx-junit                      = { group = "androidx.test.ext",            name = "junit",                         version.ref = "junitVersion" }
androidx-espresso-core              = { group = "androidx.test.espresso",       name = "espresso-core",                 version.ref = "espressoCore" }
mockk                               = { group = "io.mockk",                     name = "mockk",                         version.ref = "mockk" }
mockk-android                       = { group = "io.mockk",                     name = "mockk-android",                 version.ref = "mockk" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }
androidx-compose-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "uiText" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }

[plugins]
android-application     = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt-android            = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
