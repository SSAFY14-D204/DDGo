spring:
  application:
    name: DDGo

  datasource:
    url: ${MARIADB_URL}
    username: ${MARIADB_USER}
    password: ${MARIADB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION} # 30 min in ms
  refresh-expiration: ${JWT_REFRESH_EXPIRATION} # 14 days in ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
