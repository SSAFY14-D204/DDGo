version: '3.8'

services:
  # 1. MariaDB 설정
  mariadb:
    image: mariadb:10.11
    container_name: ddgo-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: ddgo_db
      MARIADB_USER: ddgo_user
      MARIADB_PASSWORD: ddgo_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - ddgo-network

  # 2. Redis 설정
  redis:
    image: redis:latest
    container_name: ddgo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ddgo-network

  # 3. MinIO 설정 (S3 호환 오브젝트 스토리지)
  minio:
    image: minio/minio
    container_name: ddgo-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API 포트
      - "9001:9001" # 웹 UI(Console) 포트
    volumes:
      - minio_data:/data
    networks:
      - ddgo-network

volumes:
  mariadb_data:
  redis_data:
  minio_data:


networks:
  ddgo-network:
    driver: bridge
